<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaeltec Tools</title>
<!-- BUILT FILE - edit page_template.html / the .py files, then run build_page.py -->
<style>
:root{
  --navy:#0B2545; --blue:#1F4E78; --sky:#00A6D6; --sky-soft:#E3F6FC;
  --bg:#F2F5F9; --card:#FFFFFF; --ink:#16213A; --muted:#5B6B82; --line:#DCE3EC;
  --ok:#1E8E5A; --ok-soft:#E3F5EC; --warn:#B7791F; --err:#C0392B; --err-soft:#FBEAEA;
  --shadow:0 1px 2px rgba(16,33,58,.06),0 4px 16px rgba(16,33,58,.06);
  --radius:14px;
}
:root[data-theme=dark]{--bg:#0D1524;--card:#152036;--ink:#E6ECF5;--muted:#9AA9BF;--line:#26344F;
        --sky-soft:#0F3346;--ok-soft:#10301F;--err-soft:#3A1717;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);color-scheme:dark}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){--bg:#0D1524;--card:#152036;--ink:#E6ECF5;--muted:#9AA9BF;--line:#26344F;
        --sky-soft:#0F3346;--ok-soft:#10301F;--err-soft:#3A1717;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--sky)}

/* ---------- header ---------- */
header{background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;padding:18px 28px;display:flex;align-items:center;gap:16px}
header img{height:46px;background:#fff;border-radius:8px;padding:4px 8px}
.hlogo:not(.has){display:none}
.hlogo img{display:block}
header .brand h1{margin:0;font-size:22px;letter-spacing:.3px}
header .brand p{margin:0;opacity:.8;font-size:13px}
header .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:13px;background:rgba(255,255,255,.14)}
.dot{width:8px;height:8px;border-radius:50%;background:#aaa}
.dot.on{background:#3DDC84}.dot.off{background:#FF6B6B}

main{max-width:1180px;margin:0 auto;padding:26px 20px 60px}

/* ---------- home grid ---------- */
.intro{color:var(--muted);margin:0 0 18px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 22px;color:var(--muted);font-size:13px}
.flow span.step{background:var(--card);border:1px solid var(--line);padding:4px 10px;border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;text-align:left;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;display:flex;flex-direction:column;gap:10px}
.tile:hover{transform:translateY(-3px);border-color:var(--sky);box-shadow:0 8px 28px rgba(0,120,180,.15)}
.tile .ico{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;color:#fff}
.tile h3{margin:4px 0 0;font-size:18px}
.tile p{margin:0;color:var(--muted);font-size:14px;flex:1}
.tile .tag{align-self:flex-start;font-size:12px;font-weight:600;color:var(--blue);background:var(--sky-soft);padding:3px 10px;border-radius:99px}
:root[data-theme=dark] .tile .tag{color:#7FD3F0}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]) .tile .tag{color:#7FD3F0}}
.tile .go{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--sky)}
.c1{background:linear-gradient(135deg,#1F4E78,#2E86C1)}.c2{background:linear-gradient(135deg,#0E7C86,#1ABC9C)}
.c3{background:linear-gradient(135deg,#6C3FB5,#9B59B6)}.c4{background:linear-gradient(135deg,#C0762B,#E6A23C)}
.c5{background:linear-gradient(135deg,#B03A48,#E4606D)}
.c6{background:linear-gradient(135deg,#1E6B52,#3DAA6E)}

/* ---------- tool page ---------- */
.toolhead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.toolhead .ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.toolhead h2{margin:0;font-size:22px}
.toolhead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.back{margin-right:4px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.box h4{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:10px}
.num{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.hint{color:var(--muted);font-size:13px;margin:-4px 0 12px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.grow{flex:1 1 280px}
input[type=text],input[type=date],input[type=number],input[type=password],select{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 11px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--sky);outline-offset:1px}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--sky)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#17405f}
.btn.big{padding:12px 22px;font-size:16px;border-radius:12px}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}

.picked{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;min-height:42px;background:var(--bg)}
.picked .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.picked .txt.none{color:var(--muted);font-style:italic;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sky-soft);border-radius:8px;padding:3px 8px;font-size:13px;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;cursor:pointer;padding:0 2px;color:var(--muted);font-size:15px;line-height:1}
.status{font-size:14px;color:var(--muted)}
.status.ok{color:var(--ok)}.status.err{color:var(--err)}

/* ---------- run / log ---------- */
.runbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden;flex:1 1 200px;display:none}
.progress.on{display:block}
.progress i{display:block;height:100%;width:35%;background:var(--sky);border-radius:99px;animation:slide 1.2s infinite ease-in-out}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
.log{margin-top:12px;background:#0E1A2B;color:#CFE3F7;border-radius:10px;padding:12px 14px;font:12.5px/1.5 Consolas,"Cascadia Mono",monospace;max-height:280px;overflow:auto;white-space:pre-wrap;display:none}
.log.on{display:block}
.outputs{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.out{display:flex;align-items:center;gap:10px;background:var(--ok-soft);border-radius:10px;padding:9px 12px}
.out .txt{flex:1;min-width:0}
.out b{display:block}.out small{color:var(--muted);word-break:break-all}
.errbox{background:var(--err-soft);color:var(--err);border-radius:10px;padding:10px 12px;margin-top:12px;white-space:pre-wrap;display:none}
.errbox.on{display:block}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tab .num{background:var(--sky-soft);color:var(--blue)}
.tab.on .num{background:#fff}

/* ---------- WI list filter (search + click to toggle) ---------- */
.lfilters{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.lf{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.lf .hd{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.lf .hd .cnt{color:var(--sky);font-weight:600}
.lf input{padding:6px 9px;font-size:13px}
.lf ul{list-style:none;margin:0;padding:0;height:170px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
.lf li{padding:4px 8px;font-size:13px;cursor:pointer;user-select:none;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lf li:hover{background:var(--sky-soft)}
.lf li.sel{background:var(--blue);color:#fff}
.lf .btns{display:flex;gap:6px}

/* ---------- Materials combobox (tick list + custom value) ---------- */
.mfilters{display:flex;flex-wrap:wrap;gap:14px}
.msc{position:relative}
.msc>button{min-width:170px;justify-content:space-between}
.msc>button .v{overflow:hidden;text-overflow:ellipsis;max-width:190px}
.pop{position:absolute;z-index:40;top:calc(100% + 6px);left:0;width:290px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.2);padding:10px;display:flex;flex-direction:column;gap:8px}
.pop .list{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.pop label{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 2px;cursor:pointer}
.pop .add{display:flex;gap:6px}.pop .add input{flex:1;padding:6px 9px}
.pop .acts{display:flex;gap:6px;justify-content:flex-end}

/* ---------- tables ---------- */
.tablewrap{overflow:auto;max-height:360px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--blue);color:#fff;text-align:left;padding:7px 9px;white-space:nowrap}
td{padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
tr:nth-child(even) td{background:var(--bg)}

/* ---------- TP pairs ---------- */
.pair{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.pair .meta{font-size:12px;color:var(--muted);margin-bottom:6px}
.pair .ln{font-size:14px;margin:2px 0}
.pair .diff{font:12.5px Consolas,monospace;background:var(--bg);padding:6px 8px;border-radius:8px;margin:6px 0;word-break:break-word}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{display:none}
.seg input:checked+span{color:#fff}
.seg label:has(input:checked){background:var(--blue);color:#fff}

/* ---------- file browser modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(8,18,35,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.on{display:flex}
.modal{background:var(--card);border-radius:16px;width:min(960px,100%);height:min(640px,100%);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;font-size:17px;flex:1}
.modal .mb{flex:1;display:flex;min-height:0}
.roots{width:220px;border-right:1px solid var(--line);padding:10px;overflow:auto;flex:none}
.roots button{width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:14px}
.roots button:hover{background:var(--sky-soft)}
.roots button.on{background:var(--blue);color:#fff}
.roots button small{display:block;opacity:.7;font-size:11px}
.pane{flex:1;display:flex;flex-direction:column;min-width:0}
.crumbs{padding:10px 14px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumbs .path{flex:1;min-width:120px;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.files{flex:1;overflow:auto}
.frow{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.frow:hover{background:var(--sky-soft)}
.frow.sel{background:var(--blue);color:#fff}
.frow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .dt{color:var(--muted);font-size:12px;width:130px;text-align:right}
.frow.sel .dt{color:#dbe8f5}
.frow svg{width:18px;height:18px;flex:none}
.empty{padding:30px;text-align:center;color:var(--muted)}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.modal .mf .sum{flex:1;font-size:13px;color:var(--muted);min-width:150px}
@media (max-width:560px){#srv span:last-child{display:none}}
@media (max-width:700px){.roots{width:130px}.frow .dt{display:none}header{padding:14px 16px}main{padding:18px 16px 50px}}
.hidden{display:none!important}
/* ---------- home: shared files ---------- */
.shared{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin:0 0 26px}
.shared .sh{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.shared .sh .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.shared h3{margin:2px 0 2px;font-size:17px}
.shared p{margin:0;color:var(--muted);font-size:13.5px}
.shared .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.shared .slot{max-width:none;min-width:0;box-shadow:none;background:var(--bg)}
.shared .slot.has{background:var(--card)}
/* ---------- "still using?" prompt ---------- */
.idle-card{background:var(--card);border-radius:16px;width:min(460px,100%);padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
.idle-card .iico{width:46px;height:46px;border-radius:13px;display:inline-grid;place-items:center;color:#fff}
.idle-card h3{margin:8px 0 6px;font-size:19px}
.idle-card p{margin:0 0 10px;color:var(--muted);font-size:14px}
.idle-card .cd{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;margin:4px 0 14px}
.idle-card .row{justify-content:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-size:14px;z-index:120;box-shadow:var(--shadow);max-width:min(560px,calc(100% - 32px))}
h2.section{margin:34px 0 4px;font-size:20px}
.dstat[data-state=running]{color:var(--ok);background:var(--ok-soft)}
.dstat[data-state=failed]{color:var(--err);background:var(--err-soft)}
.dstat[data-state=starting]{color:var(--warn)}
.toolhead .dstat{white-space:nowrap;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--sky-soft)}
.dashframe{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.dashframe iframe{display:block;width:100%;height:calc(100vh - 210px);min-height:640px;border:0;background:#fff}
@media (max-width:700px){.toolhead{flex-wrap:wrap}}

/* ---------- drop zones ---------- */
.dz{display:flex;align-items:center;gap:14px;border:2px dashed var(--line);border-radius:12px;padding:14px 16px;background:var(--bg);cursor:pointer;transition:border-color .12s,background .12s}
.dz:hover,.dz:focus-visible{border-color:var(--sky);outline:none}
.dz.over{border-color:var(--sky);background:var(--sky-soft)}
.dz.has{border-style:solid;border-color:var(--sky)}
.dz.busy{opacity:.6;pointer-events:none}
.dz .dzi{width:40px;height:40px;border-radius:10px;background:var(--sky-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.dz .dzi svg{width:22px;height:22px}
.dz .dzt{display:flex;flex-direction:column;gap:2px;font-size:14px;min-width:0}
.dz .dzt small{color:var(--muted);font-size:12px}
.dz .dzt u{color:var(--sky);text-decoration:none;font-weight:600}
.dzc{margin-top:8px}
.chip small{color:var(--muted);font-size:11px}
.dot.busy{background:#F5B942;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
h2.section{margin:34px 0 4px;font-size:20px}
.dstat[data-state=running]{color:var(--ok)!important;background:var(--ok-soft)!important}
.dstat[data-state=stopped]{color:var(--muted)!important}
.toolhead .dstat{white-space:nowrap;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--sky-soft)}
.dashframe{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.dashframe iframe{display:block;width:100%;height:calc(100vh - 210px);min-height:640px;border:0;background:#fff}
code{font-family:Consolas,monospace;background:var(--bg);padding:1px 5px;border-radius:5px}
@media (max-width:700px){.toolhead{flex-wrap:wrap}}
.lgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.lgroup{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.lgroup h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.lgroup h3 svg{width:18px;height:18px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.lcard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--ink);background:var(--bg);transition:border-color .12s,transform .12s}
.lcard:hover{border-color:var(--sky);transform:translateY(-2px)}
.lcard .li{width:38px;height:38px;border-radius:10px;background:var(--sky-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.lcard .li svg{width:20px;height:20px}
.lcard .lt{flex:1;min-width:0;display:flex;flex-direction:column}
.lcard .lt b{font-size:14.5px}
.lcard .lt small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcard > svg{width:16px;height:16px;color:var(--muted);flex:none}
/* ---------- Guide (side panel) ---------- */
.gbtn{gap:6px}.gbtn svg{width:16px;height:16px}
header .gbtn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff}
header .gbtn:hover{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.55)}
.gd-bg{position:fixed;inset:0;z-index:150;background:rgba(8,18,35,0);transition:background .18s}
.gd-bg.on{background:rgba(8,18,35,.35)}
.gd{position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--card);color:var(--ink);box-shadow:-12px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s ease-out}
.gd-bg.on .gd{transform:none}
@media (prefers-reduced-motion: reduce){.gd,.gd-bg{transition:none}}
.gd-top{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.gd-pick{flex:1;min-width:0}
.gd-x{padding:6px 8px}.gd-x svg{width:16px;height:16px}
.gd-body{flex:1;overflow:auto;padding:18px 20px 32px}
.gd-head{display:flex;gap:14px;align-items:center}
.gd-head .ico{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;color:#fff;flex:none}
.gd-head h2{margin:0;font-size:19px}.gd-head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.gd-sec{margin-top:20px}
.gd-sec h3{margin:0 0 9px;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.gd-need{display:flex;flex-wrap:wrap;gap:8px}
.gd-file,.gd-tab{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--bg);min-width:0}
.gd-file{flex:1 1 180px}
.gd-file b,.gd-tab b{display:block;font-size:13.5px}
.gd-file small,.gd-tab small{display:block;color:var(--muted);font-size:12px;line-height:1.35}

/* ======================================================================
   Python runtime (web worker)
   ====================================================================== */
const PY = (() => {
  let worker = null, seq = 0, readyP = null, isReady = false, lastStatus = "";
  const pend = new Map(), statusCbs = [], mounted = new Set();
  const setStatus = (t, state) => { lastStatus = t; statusCbs.forEach(cb => cb(t, state)); };
  function send(type, payload, onLog){
    const id = ++seq;
    return new Promise((res, rej) => { pend.set(id, {res, rej, onLog}); worker.postMessage({type, id, ...payload}); });
  }
  function start(){
    if (worker) return readyP;
    const src = document.getElementById("worker-src").textContent;
    worker = new Worker(URL.createObjectURL(new Blob([src], {type: "text/javascript"})));
    worker.onmessage = (e) => {
      const m = e.data;
      if (m.type === "status"){ if (m.ready){ isReady = true; setStatus("Python ready", "on"); } else setStatus(m.text, "busy"); return; }
      const p = pend.get(m.id); if (!p) return;
      if (m.type === "log") p.onLog && p.onLog(m.text);
      else if (m.type === "done"){ pend.delete(m.id); p.res(m); }
      else if (m.type === "error"){ pend.delete(m.id); p.rej(new Error(m.error)); }
    };
    worker.onerror = (e) => setStatus("Python failed to start: " + (e.message || "worker error"), "off");
    readyP = send("init", {indexURL: PYODIDE_URL, sources: PY_SOURCES, libzip: PYLIBS_B64})
      .catch(e => {
        const msg = /fetch|network|importScripts|Failed to load/i.test(e.message)
          ? "Couldn't download Python from cdn.jsdelivr.net – check the internet connection / that the site isn't blocked."
          : e.message;
        setStatus(msg, "off"); readyP = null; worker.terminate(); worker = null;
        throw new Error(msg);
      });
    return readyP;
  }
  return {
    start, onStatus(cb){ statusCbs.push(cb); if (lastStatus) cb(lastStatus, isReady ? "on" : "busy"); },
    get ready(){ return isReady; },
    async mount(items, opts = {}){ await start(); const dir = (await send("mount", {items})).dir; if (!opts.system) mounted.add(dir); return dir; },
    async unmount(dir){ mounted.delete(dir); if (worker && dir) await send("unmount", {dir}).catch(() => {}); },
    async call(fn, kwargs, opts = {}){
      await start();
      return send("call", {fn, kwargs: JSON.stringify(kwargs || {}), needs: opts.needs || []}, opts.onLog);
    },
    /* files currently handed to Python (dropped on any tool or dashboard) */
    get hasFiles(){ return mounted.size > 0; },
    get busy(){ return pend.size > 0; },
    /* forget everything: stop Python (its memory, files and results go with it)
       and start a fresh one in the background */
    reset(){
      if (worker){ worker.terminate(); worker = null; }
      readyP = null; isReady = false; mounted.clear();
      pend.forEach(p => p.rej(new Error("Stopped - the uploaded files were cleared.")));
      pend.clear();
      setStatus("Restarting Python…", "busy");
      setTimeout(() => start().catch(() => {}), 300);
    },
  };
})();

/* ---------- reading dropped folders ---------- */
async function entriesFromDataTransfer(dt){
  // returns [{rel, file}] - rel keeps the folder structure ("Folder/sub/x.pdf")
  const items = [...dt.items].map(it => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean);
  const out = [];
  async function walk(entry, prefix){
    if (entry.isFile){
      const file = await new Promise((res, rej) => entry.file(res, rej));
      out.push({rel: prefix + file.name, file});
    } else if (entry.isDirectory){
      const reader = entry.createReader();
      let batch;
      do {
        batch = await new Promise((res, rej) => reader.readEntries(res, rej));
        for (const e of batch) await walk(e, prefix + entry.name + "/");
      } while (batch.length);
    }
  }
  if (items.length) { for (const e of items) await walk(e, ""); }
  else [...dt.files].forEach(f => out.push({rel: f.name, file: f}));
  return out;
}

/* Drop zone for files (kind 'file' / 'files').
   types = [[label, ".a,.b"], ...] - same file-type filter as the old dialogs;
   a type with "" means "All files". */
function dropField({label, kind, types, onChange, hint, system}){
  const multi = kind === "files";
  const exts = (types || []).map(t => t[1]).filter(Boolean).join(",").split(",").filter(Boolean);
  const anyType = !types || !types.length || types.some(t => !t[1]);
  const accept = anyType ? "" : exts.join(",");
  const typeText = anyType ? (exts.length ? exts.join(" ") + " or any file" : "any file") : exts.join(" ");
  const state = {items: []};   // {name, path, dir, size}
  const el = h(`<div class="field grow"><label>${esc(label)}</label>
    <div class="dz" tabindex="0">
      <div class="dzi">${I.drop}</div>
      <div class="dzt"><span><b>Drop ${multi ? "files" : "a file"} here</b> or <u>click to choose</u></span><small>${esc(hint || typeText)}</small></div>
      <input type="file" class="hidden"${multi ? " multiple" : ""}${accept ? ` accept="${esc(accept)}"` : ""}>
    </div><div class="chips dzc"></div></div>`);
  const dz = $(".dz", el), inp = $("input", el), chips = $(".dzc", el);
  const render = () => {
    chips.innerHTML = "";
    state.items.forEach(it => {
      const c = h(`<span class="chip" title="${esc(it.name)}"><span>${esc(it.name)}</span><small>${fmtSize(it.size)}</small><button title="Remove">×</button></span>`);
      $("button", c).onclick = (e) => { e.stopPropagation(); PY.unmount(it.dir); state.items = state.items.filter(x => x !== it); render(); onChange && onChange(el.get()); };
      chips.append(c);
    });
    if (multi && state.items.length > 1){
      const c = h(`<button class="btn sm ghost">Clear all</button>`);
      c.onclick = () => { state.items.forEach(it => PY.unmount(it.dir)); state.items = []; render(); onChange && onChange(el.get()); };
      chips.append(c);
    }
    dz.classList.toggle("has", state.items.length > 0);
  };
  async function add(files){
    let list = [...files];
    const bad = anyType ? [] : list.filter(f => !exts.includes(extOf(f.name)));
    list = list.filter(f => !bad.includes(f));
    if (bad.length) alert(`Skipped ${bad.length} file(s) that aren't ${exts.join(" / ")}:\n` + bad.map(f => "  • " + f.name).join("\n"));
    if (!list.length) return;
    if (!multi) list = list.slice(0, 1);
    dz.classList.add("busy");
    try {
      for (const f of list){
        const dir = await PY.mount([{rel: f.name, file: f}], {system});   // system = e.g. the report logos, not user data
        const it = {name: f.name, path: dir + "/" + f.name, dir, size: f.size};
        if (multi){ state.items = state.items.filter(x => x.name !== f.name).concat(it); }
        else { state.items.forEach(x => PY.unmount(x.dir)); state.items = [it]; }
      }
    } catch(e){ alert("Couldn't load the file: " + e.message); }
    dz.classList.remove("busy");
    render(); onChange && onChange(el.get());
  }
  dz.onclick = () => inp.click();
  dz.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); inp.click(); } };
  inp.onchange = () => { add(inp.files); inp.value = ""; };
  dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("over"); };
  dz.ondragleave = () => dz.classList.remove("over");
  dz.ondrop = async (e) => {
    e.preventDefault(); dz.classList.remove("over");
    const ents = await entriesFromDataTransfer(e.dataTransfer);   // also picks files out of dropped folders
    add(ents.map(x => x.file));
  };
  render();
  el.get = () => multi ? state.items.map(i => i.path) : (state.items[0] ? state.items[0].path : "");
  el.names = () => state.items.map(i => i.name);
  return el;
}

/* Drop zone for whole folders -> onFolders([{top, items:[{rel, file}]}]) */
function folderDrop({label, hint, onFolders}){
  const el = h(`<div class="field grow"><label>${esc(label)}</label>
    <div class="dz" tabindex="0"><div class="dzi">${I.folder}</div>
    <div class="dzt"><span><b>Drop folder(s) here</b> or <u>click to choose a folder</u></span><small>${esc(hint || "")}</small></div>
    <input type="file" class="hidden" webkitdirectory multiple></div></div>`);
  const dz = $(".dz", el), inp = $("input", el);
  const group = (ents) => {
    const by = new Map();
    ents.forEach(x => { const top = x.rel.includes("/") ? x.rel.split("/")[0] : ""; if (!by.has(top)) by.set(top, []); by.get(top).push(x); });
    return [...by].map(([top, items]) => ({top, items}));
  };
  const go = async (ents) => { if (!ents.length) return; dz.classList.add("busy"); try { await onFolders(group(ents)); } finally { dz.classList.remove("busy"); } };
  dz.onclick = () => inp.click();
  inp.onchange = () => { go([...inp.files].map(f => ({rel: f.webkitRelativePath || f.name, file: f}))); inp.value = ""; };
  dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("over"); };
  dz.ondragleave = () => dz.classList.remove("over");
  dz.ondrop = async (e) => { e.preventDefault(); dz.classList.remove("over"); go(await entriesFromDataTransfer(e.dataTransfer)); };
  return el;
}

/* ---------- saving outputs ---------- */
function downloadBlob(name, data){
  const url = URL.createObjectURL(new Blob([data]));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
async function saveAllToFolder(files){
  const dirH = await window.showDirectoryPicker({mode: "readwrite"});
  for (const f of files){
    let name = f.name;
    try { await dirH.getFileHandle(name); if (!confirm(`'${name}' already exists in that folder. Replace it?`)) continue; } catch(e) {}
    const fh = await dirH.getFileHandle(name, {create: true});
    const w = await fh.createWritable(); await w.write(f.data); await w.close();
  }
  return dirH.name;
}

/* Run area: big button + progress + live log + output files */
function runArea(label, icon){
  const el = h(`<div>
    <div class="runbar"><button class="btn primary big">${I[icon||"play"]} ${esc(label)}</button><div class="progress"><i></i></div><span class="status"></span></div>
    <div class="errbox"></div><div class="outputs"></div><div class="log"></div></div>`);
  const btn = $("button", el), prog = $(".progress", el), stat = $(".status", el), log = $(".log", el), err = $(".errbox", el), outs = $(".outputs", el);
  el.button = btn;
  el.reset = () => { err.classList.remove("on"); outs.innerHTML = ""; log.textContent = ""; log.classList.remove("on"); stat.textContent = ""; stat.className = "status"; };
  el.fail = (m) => { err.textContent = m; err.classList.add("on"); prog.classList.remove("on"); btn.disabled = false; stat.textContent = ""; };
  const addLog = (t) => { log.classList.add("on"); log.textContent += (log.textContent ? "\n" : "") + t; log.scrollTop = log.scrollHeight; stat.textContent = String(t).split("\n").pop().slice(0, 110); };
  /* fn/kwargs -> bridge call; resolves with {result, files} */
  el.run = async (fn, kwargs, opts = {}) => {
    el.reset(); btn.disabled = true; prog.classList.add("on");
    stat.textContent = PY.ready ? (opts.busy || "Working…") : "Starting Python (first time ~30 s)…";
    let r;
    try { r = await PY.call(fn, kwargs, {needs: opts.needs, onLog: addLog}); }
    catch(e){ el.fail(e.message); stat.className = "status err"; return null; }
    btn.disabled = false; prog.classList.remove("on"); stat.textContent = "✔ Finished"; stat.className = "status ok";
    if (r.files && r.files.length){
      r.files.forEach(f => {
        const o = h(`<div class="out">${I.file.replace("<svg","<svg width=20 height=20")}<div class="txt"><b>${esc(f.name)}</b><small>${fmtSize(f.data.byteLength)}</small></div><button class="btn sm">${I.down} Download</button></div>`);
        $("button", o).onclick = () => downloadBlob(f.name, f.data);
        outs.append(o);
      });
      if (window.showDirectoryPicker){
        const b = h(`<div class="row"><button class="btn sm">${I.save} Save ${r.files.length > 1 ? "all " : ""}to a folder…</button><span class="status"></span></div>`);
        $("button", b).onclick = async () => { try { const n = await saveAllToFolder(r.files); $(".status", b).className = "status ok"; $(".status", b).textContent = "Saved to " + n; } catch(e){ if (e.name !== "AbortError") alert(e.message); } };
        outs.append(b);
      }
      if (opts.autoDownload !== false) r.files.forEach(f => downloadBlob(f.name, f.data));
    }
    return r;
  };
  return el;
}

/* ---- Tkinter "MultiSelectFilter" (Work Instructions tab 1):
        search box + click-to-toggle list + All (visible) / Clear + count ---- */
function listFilter(label){
  const st = {all: [], sel: new Set()};
  const el = h(`<div class="lf"><div class="hd">${esc(label)} <span class="cnt">(0)</span></div><input type="text" placeholder="Search…"><ul></ul><div class="btns"><button class="btn sm">All</button><button class="btn sm">Clear</button></div></div>`);
  const inp = $("input", el), ul = $("ul", el), cnt = $(".cnt", el);
  const visible = () => { const t = inp.value.trim().toLowerCase(); return t ? st.all.filter(v => String(v).toLowerCase().includes(t)) : st.all; };
  const render = () => {
    ul.innerHTML = "";
    const vis = visible(), frag = document.createDocumentFragment();
    vis.slice(0, 3000).forEach(v => { const li = document.createElement("li"); li.textContent = v; li.title = v; if (st.sel.has(v)) li.className = "sel"; li.onclick = () => { st.sel.has(v) ? st.sel.delete(v) : st.sel.add(v); li.classList.toggle("sel"); cnt.textContent = `(${st.sel.size})`; }; frag.append(li); });
    ul.append(frag);
    if (vis.length > 3000) ul.append(h(`<li style="color:var(--muted);cursor:default">…${vis.length-3000} more – type to search</li>`));
    cnt.textContent = `(${st.sel.size})`;
  };
  inp.oninput = render;
  const [bAll, bClr] = el.querySelectorAll(".btns .btn");
  bAll.onclick = () => { visible().forEach(v => st.sel.add(v)); render(); };
  bClr.onclick = () => { st.sel = new Set(); render(); };
  el.setValues = vals => { st.all = vals.slice(); st.sel = new Set(); render(); };
  el.get = () => [...st.sel].sort();
  el.clear = () => { st.sel = new Set(); inp.value = ""; render(); };
  return el;
}

/* ---- Tkinter "MultiSelectCombobox" (Materials tool):
        button shows All / value / "N selected"; pop-up tick list,
        type-in custom value + Add, All / None / OK / Cancel ---- */
let openPop = null;
function comboFilter(label, width){
  const st = {values: [], sel: []};
  const el = h(`<div class="field msc"><label>${esc(label)}</label><button class="btn" type="button"><span class="v">All</span><span>▾</span></button></div>`);
  const btn = $("button", el), v = $(".v", el);
  const upd = () => { v.textContent = !st.sel.length ? "All" : st.sel.length === 1 ? st.sel[0] : `${st.sel.length} selected`; v.title = st.sel.join(", "); };
  if (width) btn.style.minWidth = width + "px";
  btn.onclick = (e) => {
    e.stopPropagation();
    if (openPop) { openPop.remove(); const was = openPop._owner; openPop = null; if (was === el) return; }
    const pop = h(`<div class="pop"><div class="list"></div><div class="add"><input type="text" placeholder="Type a custom value"><button class="btn sm">Add</button></div><div class="acts"><button class="btn sm">All</button><button class="btn sm">None</button><button class="btn sm primary">OK</button><button class="btn sm">Cancel</button></div></div>`);
    pop._owner = el; pop.onclick = e => e.stopPropagation();
    const list = $(".list", pop), checks = new Map();
    const addRow = (val, on) => { const l = h(`<label><input type="checkbox"> <span></span></label>`); $("span", l).textContent = val; $("input", l).checked = on; list.append(l); checks.set(val, $("input", l)); };
    [...new Set([...st.values, ...st.sel])].forEach(val => addRow(val, st.sel.includes(val)));
    if (!checks.size) list.append(h(`<div class="empty" style="padding:12px">No values – load a file first</div>`));
    const inp = $(".add input", pop);
    const addCustom = () => { const val = inp.value.trim(); if (!val) return; if (checks.has(val)) checks.get(val).checked = true; else { const e0 = $(".empty", list); e0 && e0.remove(); addRow(val, true); } inp.value = ""; };
    $(".add .btn", pop).onclick = addCustom; inp.onkeydown = e => { if (e.key === "Enter") addCustom(); };
    const [bA, bN, bOk, bC] = pop.querySelectorAll(".acts .btn");
    bA.onclick = () => checks.forEach(c => c.checked = true);
    bN.onclick = () => checks.forEach(c => c.checked = false);
    bOk.onclick = () => { st.sel = [...checks].filter(([, c]) => c.checked).map(([k]) => k); upd(); pop.remove(); openPop = null; el.onchange && el.onchange(); };
    bC.onclick = () => { pop.remove(); openPop = null; };
    el.append(pop); openPop = pop;
  };
  el.setValues = vals => { st.values = vals.slice(); };
  el.setSelection = vals => { st.sel = vals.slice(); upd(); };
  el.clear = () => { st.sel = []; upd(); };
  el.get = () => st.sel.slice();
  return el;
}
document.addEventListener("click", () => { if (openPop){ openPop.remove(); openPop = null; } });

function tableEl(columns, rows){

  return t;
}

/* A tool's "Master file" box = the shared Master slot (the one on the home page
   and in the dashboards). onPath(path, file) runs now if a Master is already
   loaded, and again whenever it's replaced or removed. */
function sharedSlotField(slot, onPath, note){
  const el = slotZone(slot, true, note);
  let last = null;
  const fire = () => { const f = FILES[slot]; const p = f ? f.path : ""; if (p !== last){ last = p; onPath(p, f); } };
  const cb = k => { if (k !== slot) return; if (!el.isConnected){ fileListeners.delete(cb); return; } fire(); };
  fileListeners.add(cb);
  setTimeout(fire, 0);
  return el;
}

/* after Build Master: offer to make the new Master the shared one */
function offerAsMaster(run, r){
  const f = r && (r.files || []).find(x => /\.parquet$/i.test(x.name) && !/_aggregated|_resume/i.test(x.name));

    try { await setSlotFile("master", new File([f.data], f.name)); st.className = "status ok"; st.textContent = "✔ Loaded as the shared Master file"; }
    catch(e){ st.className = "status err"; st.textContent = e.message; }
  };
  $(".outputs", run).append(row);
}

/* ---------------- Tool 4: Outputs (CV Excel report) ---------------- */
function logoField(label, key, imgName){
  /* optional logo image, remembered in this browser so it's only dropped once */
  const el = dropField({label, kind: "file", types: [["Images", ".png,.jpg,.jpeg"]], hint: "optional – remembered for next time", system: true,
    onChange: async () => {
      try {
        const f = el._lastFile; if (!f) return;
        const r = new FileReader(); r.onload = () => store.set(key, {name: f.name, data: r.result}); r.readAsDataURL(f);
      } catch(e) {}
    }});
  const inp = $("input", el), dz = $(".dz", el);
  const keep = (f) => { el._lastFile = f; };
  inp.addEventListener("change", () => inp.files[0] && keep(inp.files[0]), true);
  dz.addEventListener("drop", (e) => e.dataTransfer.files[0] && keep(e.dataTransfer.files[0]), true);
  const saved = store.get(key, null);
  const useBlob = (b, name) => { const f = new File([b], name, {type: b.type}); const dt = new DataTransfer(); dt.items.add(f); inp.files = dt.files; inp.dispatchEvent(new Event("change")); };
  if ((!saved || !saved.data) && imgName && location.protocol.startsWith("http")) {
    fetch("Images/" + imgName, {cache: "no-cache"}).then(r => r.ok ? r.blob() : Promise.reject()).then(b => useBlob(b, imgName)).catch(() => {});
  }
  if (saved && saved.data) {

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function outageLayout(top, items){
  /* Put a dropped folder where it belongs in the Outages Programme layout
     (<YYYY>/<MM - Month>/<outage>) so the SAME network-scan code can run on
     it, and its maps can be linked back to the real share. */
  const subs = new Set(items.map(x => x.rel.split("/")[1]).filter(Boolean));
  if ([...subs].some(s => /^\d{4}$/.test(s))) return {prefix: "", rootSuffix: "/" + top, kind: "programme"};   // the whole Outages Programme folder
  if (/^\d{4}$/.test(top)) return {prefix: "", rootSuffix: "", kind: "year"};
  if (/^\d{2}\s*-\s*.+$/.test(top)){
    const m = items.map(x => x.rel.match(/(\d{2})-(\d{2})-(\d{4})/)).find(Boolean);
    if (m) return {prefix: m[3] + "/", rootSuffix: "", kind: "month"};
    return null;
  }
  const d = top.match(/^(\d{2})(?:_\d{2})?-(\d{2})-(\d{4})/);
  if (d) return {prefix: `${d[3]}/${d[2]} - ${MONTHS[+d[2]-1]}/`, rootSuffix: "", kind: "outage"};
  return null;
}

  const dBtns = h(`<div class="row" style="margin-bottom:10px"><button class="btn sm">Tick all days</button><button class="btn sm">Clear all</button><span class="status"></span></div>`);
  const [bAll, bNone] = dBtns.querySelectorAll(".btn"); const selStat = $(".status", dBtns);
  const list = h(`<div style="max-height:460px;overflow:auto;border:1px solid var(--line,#ddd);border-radius:10px;padding:8px 12px"></div>`);
  b3.append(dBtns, list);

  function resetDays(){
    days = []; list.innerHTML = `<p class="hint" style="margin:6px 0">Click <b>Show days &amp; outages</b>.</p>`;
    selStat.textContent = ""; clearPreview();
  }
  function countSel(){
    const n = ids().length; selStat.className = "status"; selStat.textContent = n ? `${n} outage(s) selected` : "";
    clearPreview();
  }
  function ids(){
    return days.flatMap(d => d.cb.checked ? d.items.filter(x => x.cb.checked).map(x => x.id) : []);
  }
  $(".btn", dr).onclick = async () => {
    clearPreview();
    if (!loaded){ dStat.className = "status err"; dStat.textContent = "Read both workbooks first (step 1)."; return; }
    dStat.className = "status"; dStat.textContent = "Listing outages…";
    try {
      const r = (await PY.call("gs_days", {task: task(), date_from: dFrom.value, date_to: dTo.value})).result;
      list.innerHTML = ""; days = [];
      if (!r.days.length){
        list.innerHTML = `<p class="hint" style="margin:6px 0">No outages in this date range${task() === 2 ? " with Type of supply = Generator / Battery pod" : ""}.</p>`;
        dStat.textContent = ""; return;
      }
      r.days.forEach(d => {
        const day = h(`<div style="padding:4px 0;border-bottom:1px solid var(--line,#eee)">
            <label style="display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer"><input type="checkbox"><span></span></label>
            <div class="hidden" style="padding:4px 0 6px 28px"></div></div>`);
        $("span", day).textContent = `${d.label}  (${d.items.length} outage${d.items.length > 1 ? "s" : ""})`;
        const dayCb = $("input", day), inner = $("div", day);
        const entry = {cb: dayCb, items: []};
        d.items.forEach(it => {
          const row = h(`<label style="display:flex;gap:8px;align-items:center;padding:2px 0;cursor:pointer;font-size:13px"><input type="checkbox" checked><span></span></label>`);
          $("span", row).textContent = it.label;
          const cb = $("input", row); cb.onchange = countSel;
          entry.items.push({id: it.id, cb}); inner.append(row);
        });
        dayCb.onchange = () => { inner.classList.toggle("hidden", !dayCb.checked); if (dayCb.checked) entry.items.forEach(x => x.cb.checked = true); countSel(); };
        days.push(entry); list.append(day);
      });
      dStat.className = "status ok"; dStat.textContent = `${r.days.length} day(s)`;
    } catch(e){ dStat.className = "status err"; dStat.textContent = e.message; }
  };
  bAll.onclick = () => { days.forEach(d => { if (!d.cb.checked){ d.cb.checked = true; d.cb.onchange(); } }); };
  bNone.onclick = () => { days.forEach(d => { if (d.cb.checked){ d.cb.checked = false; d.cb.onchange(); } }); };

  /* 4 - preview + decisions */
  const b4 = box(4, "Preview", "Anything already filled in: choose keep or replace.");
  const pv = h(`<div class="runbar"><button class="btn">${I.search} Preview</button><span class="status"></span></div>`);
  const pvStat = $(".status", pv);
  const pvOut = h(`<div style="margin-top:12px"></div>`);
  const conf = h(`<div style="margin-top:12px"></div>`);
  b4.append(pv, pvOut, conf);
  function clearPreview(){ preview = null; choiceEls = new Map(); pvOut.innerHTML = ""; conf.innerHTML = ""; pvStat.textContent = ""; if (run) run.button.disabled = true; }
  $(".btn", pv).onclick = async () => {
    clearPreview();
    const sel = ids();
    if (!days.length){ pvStat.className = "status err"; pvStat.textContent = "Click Show days & outages first (step 2)."; return; }
    if (!sel.length){ pvStat.className = "status err"; pvStat.textContent = "Tick at least one day (and outage)."; return; }
    pvStat.className = "status"; pvStat.textContent = "Working out what will change…";
    try {
      const r = (await PY.call("gs_preview", {task: task(), ids: sel})).result;
      preview = r;
      pvStat.className = "status ok"; pvStat.textContent = r.summary;
      pvOut.append(tableEl(r.columns, r.rows));
      if (r.conflicts.length){
        const opts = `<option value="">— choose —</option>` + r.choices.map(c => `<option value="${esc(c.value)}">${esc(c.label)}</option>`).join("");
        const head = h(`<div class="row" style="align-items:center;margin:4px 0 10px"><b style="color:#b26a00">${r.conflicts.length} item(s) already have information in the file – what do you want to do?</b>
            <div class="field"><label>Set all to</label><select style="min-width:260px">${opts}</select></div></div>`);
        const all = $("select", head);
        conf.append(head);
        r.conflicts.forEach(c => {
          const card = h(`<div style="display:flex;gap:14px;align-items:center;border-left:3px solid #e69500;background:rgba(230,149,0,.08);border-radius:6px;padding:8px 10px;margin:6px 0">
              <div style="flex:1;font-size:13px;line-height:1.45"><b></b><div class="cur"></div><div class="new"></div></div><select style="min-width:260px">${opts}</select></div>`);
          $("b", card).textContent = c.where;
          $(".cur", card).innerHTML = "Current: " + esc(c.current).replace(/\n/g, "<br>");
          $(".new", card).innerHTML = "New: " + esc(c.new).replace(/\n/g, "<br>");
          const s = $("select", card); choiceEls.set(c.i, s);
          conf.append(card);
        });
        all.onchange = () => { if (all.value) choiceEls.forEach(s => s.value = all.value); };
      }
      run.button.disabled = !r.can_apply;
    } catch(e){ pvStat.className = "status err"; pvStat.textContent = e.message; }
  };

  /* 5 - apply */
  const b5 = box(5, "Apply & download", "Downloads an updated copy – the original isn't touched.");
  run = runArea("Apply & download", "save");
  run.button.disabled = true;
  b5.append(run);
  run.button.onclick = async () => {
    if (!preview){ run.fail("Click Preview first (step 4)."); return; }
    const choices = {};
    let missing = 0;
    choiceEls.forEach((s, i) => { if (s.value) choices[i] = s.value; else missing++; });
    if (missing){ run.fail(`Choose keep / replace for the ${missing} item(s) that already have information (or use 'Set all to').`); return; }
    const r = await run.run("gs_apply", {choices}, {needs: needCrypt ? NEED_GS_CRYPT : [], busy: "Writing the workbook…"});
    if (!r) return;
    preview = null; choiceEls = new Map(); conf.innerHTML = ""; pvOut.innerHTML = ""; run.button.disabled = true;
    pvStat.className = "status ok"; pvStat.textContent = "Applied – click Show days & outages / Preview again for another run (it continues from the updated copy).";
    try { const s = (await PY.call("gs_status", {})).result; fStat.textContent = `✔ ${s.tracker}\n✔ ${s.planning}`; } catch(e){}
  };

  resetDays();
  app.append(b1, b2, b3, b4, b5);
}

  const has = () => PY.hasFiles || Object.keys(FILES).length > 0;
  function toast(msg){ const t = h(`<div class="toast" role="status"></div>`); t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 9000); }
  function close(){ if (modal){ modal.remove(); modal = null; } askedAt = 0; }
  function clearAll(why){
    close(); pendingClear = false; since = 0;
    Object.keys(FILES).forEach(k => delete FILES[k]);
    Object.keys(DST).forEach(k => delete DST[k]);
    PY.reset();                                              // Python's copies, results and caches go with it
    route();                                                 // redraw the page without the files / results
    toast(why);
  }
  function ask(){
    askedAt = Date.now();
    modal = h(`<div class="modal-bg on idle"><div class="idle-card" role="alertdialog" aria-labelledby="idle-h" aria-describedby="idle-p">
      <div class="iico c1">${I.clock.replace("<svg","<svg width=24 height=24")}</div>
      <h3 id="idle-h">Are you still using this page?</h3>
      <p id="idle-p">Files have been loaded here for 30 minutes. If there's no answer, they'll be cleared from the page so the information isn't left open.</p>
      <div class="cd" aria-live="polite"></div>
      <div class="row"><button class="btn primary">Yes, I'm still using it</button><button class="btn">Clear my files now</button></div></div></div>`);
    const [yes, no] = modal.querySelectorAll(".btn");
    yes.onclick = () => { close(); since = Date.now(); };
    no.onclick = () => clearAll("Your files were cleared.");
    document.body.append(modal); yes.focus();
    tick();
  }
  function tick(){
    const now = Date.now();
    if (!has()){ since = 0; pendingClear = false; if (modal) close(); return; }
    if (!since) since = now;                                 // the clock starts with the first file
    if (pendingClear){ if (!PY.busy) clearAll("Your files were cleared after 30 minutes with no answer."); return; }
    if (modal){
      const left = Math.max(0, ANSWER_WITHIN - (now - askedAt));
      $(".cd", modal).textContent = `${Math.floor(left / 60e3)}:${String(Math.floor(left / 1e3) % 60).padStart(2, "0")}`;
      if (!left){
        if (PY.busy){ pendingClear = true; close(); }        // a run is still going: clear the moment it ends
        else clearAll("Your files were cleared after 30 minutes with no answer.");
      }
      return;
    }
    if (now - since >= ASK_AFTER) ask();
  }
  setInterval(tick, 1000);
  return {tick, clearAll};
})();

/* ---- gentle "digital click" when an option on the home page is clicked ---- */
const uiClick = (() => {
  let ctx = null;
  return () => {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      o.type = "sine";
      o.frequency.setValueAtTime(1900, t);
      o.frequency.exponentialRampToValueAtTime(1100, t + 0.03);
      f.type = "lowpass"; f.frequency.value = 3200;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.045, t + 0.004);   // very soft
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
      o.connect(f).connect(g).connect(ctx.destination);
      o.start(t); o.stop(t + 0.06);
    } catch(e){}
  };
})();
document.addEventListener("pointerdown", e => {
  if (e.button === 0 && e.target.closest && e.target.closest("#app .tile, #app .lcard")) uiClick();
}, {passive: true});
