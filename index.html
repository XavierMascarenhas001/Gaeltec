<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaeltec Tools</title>
<style>
:root{
  --navy:#0B2545; --blue:#1F4E78; --sky:#00A6D6; --sky-soft:#E3F6FC;
  --bg:#F2F5F9; --card:#FFFFFF; --ink:#16213A; --muted:#5B6B82; --line:#DCE3EC;
  --ok:#1E8E5A; --ok-soft:#E3F5EC; --warn:#B7791F; --err:#C0392B; --err-soft:#FBEAEA;
  --shadow:0 1px 2px rgba(16,33,58,.06),0 4px 16px rgba(16,33,58,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0D1524;--card:#152036;--ink:#E6ECF5;--muted:#9AA9BF;--line:#26344F;
        --sky-soft:#0F3346;--ok-soft:#10301F;--err-soft:#3A1717;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--sky)}

/* ---------- header ---------- */
header{background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;padding:18px 28px;display:flex;align-items:center;gap:16px}
header img{height:46px;background:#fff;border-radius:8px;padding:4px 8px}
header .brand h1{margin:0;font-size:22px;letter-spacing:.3px}
header .brand p{margin:0;opacity:.8;font-size:13px}
header .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:13px;background:rgba(255,255,255,.14)}
.dot{width:8px;height:8px;border-radius:50%;background:#aaa}
.dot.on{background:#3DDC84}.dot.off{background:#FF6B6B}

main{max-width:1180px;margin:0 auto;padding:26px 20px 60px}

/* ---------- home grid ---------- */
.intro{color:var(--muted);margin:0 0 18px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 22px;color:var(--muted);font-size:13px}
.flow span.step{background:var(--card);border:1px solid var(--line);padding:4px 10px;border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;text-align:left;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;display:flex;flex-direction:column;gap:10px}
.tile:hover{transform:translateY(-3px);border-color:var(--sky);box-shadow:0 8px 28px rgba(0,120,180,.15)}
.tile .ico{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;color:#fff}
.tile h3{margin:4px 0 0;font-size:18px}
.tile p{margin:0;color:var(--muted);font-size:14px;flex:1}
.tile .tag{align-self:flex-start;font-size:12px;font-weight:600;color:var(--blue);background:var(--sky-soft);padding:3px 10px;border-radius:99px}
@media (prefers-color-scheme: dark){.tile .tag{color:#7FD3F0}}
.tile .go{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--sky)}
.c1{background:linear-gradient(135deg,#1F4E78,#2E86C1)}.c2{background:linear-gradient(135deg,#0E7C86,#1ABC9C)}
.c3{background:linear-gradient(135deg,#6C3FB5,#9B59B6)}.c4{background:linear-gradient(135deg,#C0762B,#E6A23C)}
.c5{background:linear-gradient(135deg,#B03A48,#E4606D)}

/* ---------- tool page ---------- */
.toolhead{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.toolhead .ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.toolhead h2{margin:0;font-size:22px}
.toolhead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.back{margin-right:4px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.box h4{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:10px}
.num{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.hint{color:var(--muted);font-size:13px;margin:-4px 0 12px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.grow{flex:1 1 280px}
input[type=text],input[type=date],input[type=number],input[type=password],select{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 11px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--sky);outline-offset:1px}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--sky)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#17405f}
.btn.big{padding:12px 22px;font-size:16px;border-radius:12px}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}

.picked{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;min-height:42px;background:var(--bg)}
.picked .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.picked .txt.none{color:var(--muted);font-style:italic;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sky-soft);border-radius:8px;padding:3px 8px;font-size:13px;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;cursor:pointer;padding:0 2px;color:var(--muted);font-size:15px;line-height:1}
.status{font-size:14px;color:var(--muted)}
.status.ok{color:var(--ok)}.status.err{color:var(--err)}

/* ---------- run / log ---------- */
.runbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden;flex:1 1 200px;display:none}
.progress.on{display:block}
.progress i{display:block;height:100%;width:35%;background:var(--sky);border-radius:99px;animation:slide 1.2s infinite ease-in-out}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
.log{margin-top:12px;background:#0E1A2B;color:#CFE3F7;border-radius:10px;padding:12px 14px;font:12.5px/1.5 Consolas,"Cascadia Mono",monospace;max-height:280px;overflow:auto;white-space:pre-wrap;display:none}
.log.on{display:block}
.outputs{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.out{display:flex;align-items:center;gap:10px;background:var(--ok-soft);border-radius:10px;padding:9px 12px}
.out .txt{flex:1;min-width:0}
.out b{display:block}.out small{color:var(--muted);word-break:break-all}
.errbox{background:var(--err-soft);color:var(--err);border-radius:10px;padding:10px 12px;margin-top:12px;white-space:pre-wrap;display:none}
.errbox.on{display:block}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tab .num{background:var(--sky-soft);color:var(--blue)}
.tab.on .num{background:#fff}

/* ---------- WI list filter (search + click to toggle) ---------- */
.lfilters{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.lf{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.lf .hd{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px}
.lf .hd .cnt{color:var(--sky);font-weight:600}
.lf input{padding:6px 9px;font-size:13px}
.lf ul{list-style:none;margin:0;padding:0;height:170px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}
.lf li{padding:4px 8px;font-size:13px;cursor:pointer;user-select:none;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lf li:hover{background:var(--sky-soft)}
.lf li.sel{background:var(--blue);color:#fff}
.lf .btns{display:flex;gap:6px}

/* ---------- Materials combobox (tick list + custom value) ---------- */
.mfilters{display:flex;flex-wrap:wrap;gap:14px}
.msc{position:relative}
.msc>button{min-width:170px;justify-content:space-between}
.msc>button .v{overflow:hidden;text-overflow:ellipsis;max-width:190px}
.pop{position:absolute;z-index:40;top:calc(100% + 6px);left:0;width:290px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.2);padding:10px;display:flex;flex-direction:column;gap:8px}
.pop .list{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.pop label{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 2px;cursor:pointer}
.pop .add{display:flex;gap:6px}.pop .add input{flex:1;padding:6px 9px}
.pop .acts{display:flex;gap:6px;justify-content:flex-end}

/* ---------- tables ---------- */
.tablewrap{overflow:auto;max-height:360px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--blue);color:#fff;text-align:left;padding:7px 9px;white-space:nowrap}
td{padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
tr:nth-child(even) td{background:var(--bg)}

/* ---------- TP pairs ---------- */
.pair{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.pair .meta{font-size:12px;color:var(--muted);margin-bottom:6px}
.pair .ln{font-size:14px;margin:2px 0}
.pair .diff{font:12.5px Consolas,monospace;background:var(--bg);padding:6px 8px;border-radius:8px;margin:6px 0;word-break:break-word}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{display:none}
.seg input:checked+span{color:#fff}
.seg label:has(input:checked){background:var(--blue);color:#fff}

/* ---------- file browser modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(8,18,35,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.on{display:flex}
.modal{background:var(--card);border-radius:16px;width:min(960px,100%);height:min(640px,100%);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;font-size:17px;flex:1}
.modal .mb{flex:1;display:flex;min-height:0}
.roots{width:220px;border-right:1px solid var(--line);padding:10px;overflow:auto;flex:none}
.roots button{width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:14px}
.roots button:hover{background:var(--sky-soft)}
.roots button.on{background:var(--blue);color:#fff}
.roots button small{display:block;opacity:.7;font-size:11px}
.pane{flex:1;display:flex;flex-direction:column;min-width:0}
.crumbs{padding:10px 14px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumbs .path{flex:1;min-width:120px;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.files{flex:1;overflow:auto}
.frow{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.frow:hover{background:var(--sky-soft)}
.frow.sel{background:var(--blue);color:#fff}
.frow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .dt{color:var(--muted);font-size:12px;width:130px;text-align:right}
.frow.sel .dt{color:#dbe8f5}
.frow svg{width:18px;height:18px;flex:none}
.empty{padding:30px;text-align:center;color:var(--muted)}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.modal .mf .sum{flex:1;font-size:13px;color:var(--muted);min-width:150px}
@media (max-width:560px){#srv span:last-child{display:none}}
@media (max-width:700px){.roots{width:130px}.frow .dt{display:none}header{padding:14px 16px}main{padding:18px 16px 50px}}
.hidden{display:none!important}
</style>
</head>
<body>

<header>
  <img id="logo" src="" alt="" onerror="this.remove()">
  <div class="brand">
    <h1>Gaeltec Tools</h1>
    <p>SPEN Planning · OHLT UK — control files, master data and reports</p>
  </div>
  <div class="spacer"></div>
  <span class="pill" id="srv"><span class="dot"></span><span>Connecting…</span></span>
</header>

<main id="app"></main>

<!-- server-side file browser -->
<div class="modal-bg" id="fb">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="mh"><h3 id="fbTitle">Select file</h3><button class="btn ghost sm" onclick="FB.close()">✕</button></div>
    <div class="mb">
      <div class="roots" id="fbRoots"></div>
      <div class="pane">
        <div class="crumbs">
          <button class="btn sm" id="fbUp" title="Up one folder">⬆ Up</button>
          <div class="path" id="fbPath"></div>
          <input type="text" id="fbSearch" placeholder="Search…" style="width:150px">
          <select id="fbType"></select>
        </div>
        <div class="files" id="fbList"></div>
      </div>
    </div>
    <div class="mf">
      <div class="sum" id="fbSum"></div>
      <input type="text" id="fbName" class="hidden" placeholder="File name" style="width:260px">
      <button class="btn" onclick="FB.close()">Cancel</button>
      <button class="btn primary" id="fbOk">Select</button>
    </div>
  </div>
</div>

<script>
/* ======================================================================
   Small helpers
   ====================================================================== */
const Q = new URLSearchParams(location.search);
const API = (Q.get("api") || window.GAELTEC_API || "").replace(/\/$/, "");
const store = {
  get(k, d){ try{ const v = localStorage.getItem("gt_"+k); return v===null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem("gt_"+k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (sel, el=document) => el.querySelector(sel);
const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const baseName = p => String(p||"").split(/[\\/]/).filter(Boolean).pop() || p;
const dirName = p => { const s = String(p||""); const i = Math.max(s.lastIndexOf("\\"), s.lastIndexOf("/")); return i>0 ? s.slice(0,i) : s; };
const fmtDate = t => { const d = new Date(t*1000); return d.toLocaleDateString("en-GB") + " " + d.toTimeString().slice(0,5); };

async function api(path, body, method){
  const opts = { method: method || (body!==undefined ? "POST" : "GET"), headers: {} };
  const key = store.get("key", "");
  if (key) opts.headers["X-Access-Key"] = key;
  if (body !== undefined){ opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const r = await fetch(API + path, opts);
  let data = {};
  try { data = await r.json(); } catch(e) {}
  if (r.status === 401){
    const k = prompt("This server needs an access key:");
    if (k !== null){ store.set("key", k); return api(path, body, method); }
  }
  if (r.status === 409 && body && !body.overwrite){
    if (confirm(data.error || "The file already exists. Replace it?")) return api(path, {...body, overwrite:true}, method);
    throw new Error("Cancelled - nothing was overwritten.");
  }
  if (!r.ok) throw new Error(data.error || ("Server error " + r.status));
  return data;
}
const dl = p => API + "/api/download?path=" + encodeURIComponent(p) + (store.get("key","") ? "&key="+encodeURIComponent(store.get("key","")) : "");

/* ======================================================================
   Icons (inline SVG)
   ====================================================================== */
const I = {
  layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>',
  db:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 15h6"/><path d="m11 12 3 3-3 3"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 17v-5"/><path d="M12 17V8"/><path d="M16 17v-3"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15"/><path d="M15 6v15"/></svg>',
  folder:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18 9 12l6-6"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>',
  filter:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v6h8"/><rect x="7" y="13" width="10" height="8"/></svg>',
  word:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="m8 13 1.5 5 2.5-4 2.5 4 1.5-5"/></svg>',
};

/* ======================================================================
   Tools list (home page tiles)
   ====================================================================== */
const TOOLS = [
  {id:"tp", n:1, c:"c1", icon:"target", title:"Target Price → Control File",
   desc:"Copy a Template_CF and fill Auxiliar, Block1 and PA CONTROL from a Target Price (.xlsm), reviewing similar line names first."},
  {id:"aggregate", n:2, c:"c2", icon:"layers", title:"Aggregate Control Files",
   desc:"Read Block1 + PA CONTROL from many Control Files and build CF_aggregated (.xlsx + two .parquet files)."},
  {id:"master", n:3, c:"c3", icon:"db", title:"Build Master Parquet",
   desc:"Join CF_aggregated with the Project Tracker (PID / PO) and the miscelaneous file (MD Poling, Man_day)."},
  {id:"materials", n:4, c:"c4", icon:"chart", title:"Materials / CV Excel Report",
   desc:"Filter the master by district, project, circuit, category and dates, pick CV groups and export the Summary workbook."},
  {id:"wi", n:5, c:"c5", icon:"map", title:"Work Instructions & Map Check",
   desc:"Generate the Work Instructions Word document and cross-check WorkPack maps (PDF) against the Control File."},
];

/* ======================================================================
   Server-side file browser (replaces tkinter filedialog)
   ====================================================================== */
const FB = {
  roots: [], opts: null, cur: null, data: null, sel: new Set(), resolve: null,
  async loadRoots(){ if (!this.roots.length) this.roots = await api("/api/roots"); return this.roots; },
  /* opts: {title, mode:'file'|'files'|'folder'|'save', types:[[label,'.a,.b'],...], key, name} */
  async open(opts){
    this.opts = opts; this.sel = new Set();
    $("#fbTitle").textContent = opts.title || "Select";
    $("#fbSearch").value = "";
    const t = $("#fbType"); t.innerHTML = "";
    (opts.types || [["All files",""]]).forEach(([lab, ext], i) => t.append(new Option(lab + (ext ? " (" + ext.split(",").map(e=>"*"+e).join(" ") + ")" : ""), ext)));
    t.classList.toggle("hidden", opts.mode === "folder" || opts.mode === "save" && !(opts.types||[]).length);
    const nm = $("#fbName"); nm.classList.toggle("hidden", opts.mode !== "save"); nm.value = opts.name || "";
    $("#fbOk").textContent = {folder:"Use this folder", save:"Save here", files:"Add selected", file:"Select"}[opts.mode];
    await this.loadRoots();
    this.renderRoots();
    const start = opts.start || store.get("dir_" + (opts.key || "any")) || store.get("dir_any");
    $("#fb").classList.add("on");
    try { await this.go(start && this.inRoots(start) ? start : (this.roots.find(r=>r.reachable)||this.roots[0]||{}).path); }
    catch(e){ this.go((this.roots[0]||{}).path).catch(()=>{}); }
    return new Promise(res => this.resolve = res);
  },
  inRoots(p){ const n = p.toLowerCase(); return this.roots.some(r => n.startsWith(r.path.toLowerCase())); },
  renderRoots(){
    const box = $("#fbRoots"); box.innerHTML = "";
    this.roots.forEach(r => {
      const b = h(`<button title="${esc(r.path)}">${I.folder}<div><div>${esc(r.name)}</div><small>${r.reachable ? (r.writable ? "read / save" : "read only") : "not reachable"}</small></div></button>`);
      $("svg", b).style.cssText = "width:18px;height:18px;flex:none";
      b.onclick = () => this.go(r.path);
      box.append(b);
    });
    if (!this.roots.length) box.append(h(`<div class="empty">No folders configured in config.json</div>`));
  },
  async go(path){
    if (!path) { $("#fbList").innerHTML = `<div class="empty">No allowed folders are configured.</div>`; return; }
    $("#fbList").innerHTML = `<div class="empty">Loading…</div>`;
    const ext = this.opts.mode === "folder" ? "" : $("#fbType").value;
    try {
      this.data = await api("/api/browse?ext=" + encodeURIComponent(ext) + "&path=" + encodeURIComponent(path));
    } catch(e){ $("#fbList").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
    this.cur = this.data.path;
    if (this.opts.mode !== "files") this.sel = new Set();
    [...$("#fbRoots").children].forEach((b,i) => b.classList.toggle("on", this.roots[i] && this.roots[i].name === this.data.root));
    $("#fbPath").textContent = this.cur; $("#fbPath").title = this.cur;
    $("#fbUp").disabled = !this.data.parent;
    this.render();
  },
  render(){
    const term = $("#fbSearch").value.trim().toLowerCase();
    const list = $("#fbList"); list.innerHTML = "";
    const match = x => !term || x.name.toLowerCase().includes(term);
    const dirs = this.data.dirs.filter(match), files = this.opts.mode === "folder" ? [] : this.data.files.filter(match);
    dirs.forEach(d => {
      const r = h(`<div class="frow">${I.folder}<div class="nm">${esc(d.name)}</div><div class="dt">${fmtDate(d.mtime)}</div></div>`);
      r.ondblclick = () => this.go(d.path);
      r.onclick = () => this.go(d.path);
      list.append(r);
    });
    files.forEach(f => {
      const r = h(`<div class="frow${this.sel.has(f.path)?" sel":""}">${I.file}<div class="nm">${esc(f.name)}</div><div class="dt">${fmtDate(f.mtime)}</div></div>`);
      r.onclick = () => {
        if (this.opts.mode === "files"){ this.sel.has(f.path) ? this.sel.delete(f.path) : this.sel.add(f.path); }
        else if (this.opts.mode === "save"){ $("#fbName").value = f.name; }
        else { this.sel = new Set([f.path]); }
        this.render();
      };
      r.ondblclick = () => { if (this.opts.mode === "file"){ this.sel = new Set([f.path]); this.ok(); } };
      list.append(r);
    });
    if (!dirs.length && !files.length) list.append(h(`<div class="empty">${term ? "Nothing matches “"+esc(term)+"”" : "This folder is empty"}</div>`));
    const m = this.opts.mode;
    $("#fbSum").textContent = m === "files" ? `${this.sel.size} file(s) selected — click to tick, you can change folder and keep adding`
      : m === "folder" ? "Open the folder you want, then press “Use this folder”"
      : m === "save" ? (this.data.writable ? "Saving into: " + this.cur : "⚠ Saving is not allowed in this location")
      : (this.sel.size ? "Selected: " + baseName([...this.sel][0]) : "Click a file (double-click to open it straight away)");
  },
  ok(){
    const m = this.opts.mode;
    let out;
    if (m === "folder") out = this.cur;
    else if (m === "save"){ const n = $("#fbName").value.trim(); if (!n) { alert("Type a file name."); return; } out = {dir:this.cur, name:n}; }
    else { if (!this.sel.size){ alert("Select a file first."); return; } out = m === "files" ? [...this.sel] : [...this.sel][0]; }
    store.set("dir_" + (this.opts.key || "any"), this.cur); store.set("dir_any", this.cur);
    $("#fb").classList.remove("on");
    this.resolve && this.resolve(out); this.resolve = null;
  },
  close(){ $("#fb").classList.remove("on"); this.resolve && this.resolve(null); this.resolve = null; }
};
$("#fbOk").onclick = () => FB.ok();
$("#fbUp").onclick = () => FB.data && FB.data.parent && FB.go(FB.data.parent);
$("#fbSearch").oninput = () => FB.data && FB.render();
$("#fbType").onchange = () => FB.cur && FB.go(FB.cur);
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#fb").classList.contains("on")) FB.close(); });

function box(n, title, hint){
  const b = h(`<section class="box"><h4>${n ? `<span class="num">${n}</span>` : ""}${title}</h4>${hint ? `<p class="hint">${hint}</p>` : ""}</section>`);
  return b;

/* A file / folder picker field. kind: 'file' | 'files' | 'folder' */
function pickField({label, kind, types, key, title, onChange}){
  const state = {value: kind === "files" ? [] : ""};
  const el = h(`<div class="field grow"><label>${esc(label)}</label><div class="picked"><div class="chips"></div><button class="btn sm">${I.folder} Browse</button></div></div>`);
  const chips = $(".chips", el);
  const render = () => {
    chips.innerHTML = "";
    const vals = kind === "files" ? state.value : (state.value ? [state.value] : []);
    if (!vals.length){ chips.append(h(`<span class="txt none">Nothing selected yet</span>`)); return; }
    vals.forEach(v => {
      const c = h(`<span class="chip" title="${esc(v)}"><span>${esc(kind==="folder" ? v : baseName(v))}</span><button title="Remove">×</button></span>`);
      $("button", c).onclick = () => { state.value = kind === "files" ? state.value.filter(x => x !== v) : ""; render(); onChange && onChange(state.value); };
      chips.append(c);
    });
    if (kind === "files" && vals.length > 1) {
      const c = h(`<button class="btn sm ghost">Clear all</button>`); c.onclick = () => { state.value = []; render(); onChange && onChange(state.value); }; chips.append(c);
    }
  };
  $(".btn", el).onclick = async () => {
    const r = await FB.open({title: title || label, mode: kind, types, key});
    if (r === null || r === undefined) return;
    state.value = kind === "files" ? [...new Set([...state.value, ...r])] : r;
    render(); onChange && onChange(state.value);
  };
  render();
  el.get = () => state.value;
  el.set = v => { state.value = v; render(); };
  return el;
}

/* Output location (folder + file name) - replaces asksaveasfilename */
function saveField({label, defName, ext, key}){
  const el = h(`<div class="row" style="width:100%"></div>`);
  const folder = pickField({label: label || "Save into folder", kind: "folder", key: key || "out", title: "Choose where to save"});
  const nameF = h(`<div class="field" style="flex:0 1 320px"><label>File name</label><input type="text" value="${esc(defName)}"></div>`);
  el.append(folder, nameF);
  el.get = () => ({output_dir: folder.get(), output_name: $("input", nameF).value.trim()});
  el.setDir = d => { if (!folder.get()) folder.set(d); };
  el.validate = () => { if (!folder.get()) throw new Error("Choose the folder to save into."); if (!$("input", nameF).value.trim()) throw new Error("Type an output file name."); };
  return el;
}

/* Run area: big button + progress + live log + download list */
function runArea(label, icon){
  const el = h(`<div>
    <div class="runbar"><button class="btn primary big">${I[icon||"play"]} ${esc(label)}</button><div class="progress"><i></i></div><span class="status"></span></div>
    <div class="errbox"></div><div class="outputs"></div><div class="log"></div></div>`);
  const btn = $("button", el), prog = $(".progress", el), stat = $(".status", el), log = $(".log", el), err = $(".errbox", el), outs = $(".outputs", el);
  el.button = btn;
  el.reset = () => { err.classList.remove("on"); outs.innerHTML = ""; log.textContent = ""; log.classList.remove("on"); stat.textContent = ""; stat.className = "status"; };
  el.fail = (m) => { err.textContent = m; err.classList.add("on"); prog.classList.remove("on"); btn.disabled = false; stat.textContent = ""; };
  el.busy = (m) => { btn.disabled = true; prog.classList.add("on"); stat.textContent = m || "Working…"; };
  el.idle = () => { btn.disabled = false; prog.classList.remove("on"); };
  /* start = async () => {job_id}; resolves with the finished job */
  el.run = async (start, busyMsg) => {
    el.reset(); el.busy(busyMsg);
    let job;
    try { job = await start(); } catch(e){ el.fail(e.message); return null; }
    log.classList.add("on");
    let since = 0;
    while (true){
      await new Promise(r => setTimeout(r, 800));
      let s;
      try { s = await api(`/api/job/${job.job_id}?since=${since}`); } catch(e){ el.fail(e.message); return null; }
      if (s.log.length){ log.textContent += (log.textContent ? "\n" : "") + s.log.join("\n"); log.scrollTop = log.scrollHeight; stat.textContent = s.log[s.log.length-1].slice(0,110); }
      since = s.next;
      if (s.status === "done"){
        el.idle(); stat.textContent = "✔ Finished"; stat.className = "status ok";
        s.outputs.forEach(o => outs.append(h(`<div class="out">${I.file.replace("<svg","<svg width=20 height=20")}<div class="txt"><b>${esc(o.name)}</b><small>${esc(o.path)}</small></div><a class="btn sm" href="${dl(o.path)}">${I.down} Download</a></div>`)));
        return s;
      }
      if (s.status === "error"){ el.fail(s.error || "Failed"); stat.className = "status err"; return null; }
    }
  };
  return el;
}

/* ---- Tkinter "MultiSelectFilter" (Work Instructions tab 1):
        search box + click-to-toggle list + All (visible) / Clear + count ---- */
function listFilter(label){
  const st = {all: [], sel: new Set()};
  const el = h(`<div class="lf"><div class="hd">${esc(label)} <span class="cnt">(0)</span></div><input type="text" placeholder="Search…"><ul></ul><div class="btns"><button class="btn sm">All</button><button class="btn sm">Clear</button></div></div>`);
  const inp = $("input", el), ul = $("ul", el), cnt = $(".cnt", el);
  const visible = () => { const t = inp.value.trim().toLowerCase(); return t ? st.all.filter(v => String(v).toLowerCase().includes(t)) : st.all; };
  const render = () => {
    ul.innerHTML = "";
    const vis = visible(), frag = document.createDocumentFragment();
    vis.slice(0, 3000).forEach(v => { const li = document.createElement("li"); li.textContent = v; li.title = v; if (st.sel.has(v)) li.className = "sel"; li.onclick = () => { st.sel.has(v) ? st.sel.delete(v) : st.sel.add(v); li.classList.toggle("sel"); cnt.textContent = `(${st.sel.size})`; }; frag.append(li); });
    ul.append(frag);
    if (vis.length > 3000) ul.append(h(`<li style="color:var(--muted);cursor:default">…${vis.length-3000} more – type to search</li>`));
    cnt.textContent = `(${st.sel.size})`;
  };
  inp.oninput = render;
  const [bAll, bClr] = el.querySelectorAll(".btns .btn");
  bAll.onclick = () => { visible().forEach(v => st.sel.add(v)); render(); };
  bClr.onclick = () => { st.sel = new Set(); render(); };
  el.setValues = vals => { st.all = vals.slice(); st.sel = new Set(); render(); };
  el.get = () => [...st.sel].sort();
  el.clear = () => { st.sel = new Set(); inp.value = ""; render(); };
  return el;
}

/* ---- Tkinter "MultiSelectCombobox" (Materials tool):
        button shows All / value / "N selected"; pop-up tick list,
        type-in custom value + Add, All / None / OK / Cancel ---- */
let openPop = null;
function comboFilter(label, width){
  const st = {values: [], sel: []};
  const el = h(`<div class="field msc"><label>${esc(label)}</label><button class="btn" type="button"><span class="v">All</span><span>▾</span></button></div>`);
  const btn = $("button", el), v = $(".v", el);
  const upd = () => { v.textContent = !st.sel.length ? "All" : st.sel.length === 1 ? st.sel[0] : `${st.sel.length} selected`; v.title = st.sel.join(", "); };
  if (width) btn.style.minWidth = width + "px";
  btn.onclick = (e) => {
    e.stopPropagation();
    if (openPop) { openPop.remove(); const was = openPop._owner; openPop = null; if (was === el) return; }
    const pop = h(`<div class="pop"><div class="list"></div><div class="add"><input type="text" placeholder="Type a custom value"><button class="btn sm">Add</button></div><div class="acts"><button class="btn sm">All</button><button class="btn sm">None</button><button class="btn sm primary">OK</button><button class="btn sm">Cancel</button></div></div>`);
    pop._owner = el; pop.onclick = e => e.stopPropagation();
    const list = $(".list", pop), checks = new Map();
    const addRow = (val, on) => { const l = h(`<label><input type="checkbox"> <span></span></label>`); $("span", l).textContent = val; $("input", l).checked = on; list.append(l); checks.set(val, $("input", l)); };
    [...new Set([...st.values, ...st.sel])].forEach(val => addRow(val, st.sel.includes(val)));
    if (!checks.size) list.append(h(`<div class="empty" style="padding:12px">No values – load a file first</div>`));
    const inp = $(".add input", pop);
    const addCustom = () => { const val = inp.value.trim(); if (!val) return; if (checks.has(val)) checks.get(val).checked = true; else { const e0 = $(".empty", list); e0 && e0.remove(); addRow(val, true); } inp.value = ""; };
    $(".add .btn", pop).onclick = addCustom; inp.onkeydown = e => { if (e.key === "Enter") addCustom(); };
    const [bA, bN, bOk, bC] = pop.querySelectorAll(".acts .btn");
    bA.onclick = () => checks.forEach(c => c.checked = true);
    bN.onclick = () => checks.forEach(c => c.checked = false);
    bOk.onclick = () => { st.sel = [...checks].filter(([, c]) => c.checked).map(([k]) => k); upd(); pop.remove(); openPop = null; el.onchange && el.onchange(); };
    bC.onclick = () => { pop.remove(); openPop = null; };
    el.append(pop); openPop = pop;
  };
  el.setValues = vals => { st.values = vals.slice(); };
  el.setSelection = vals => { st.sel = vals.slice(); upd(); };
  el.clear = () => { st.sel = []; upd(); };
  el.get = () => st.sel.slice();
  return el;
}
document.addEventListener("click", () => { if (openPop){ openPop.remove(); openPop = null; } });

function tableEl(columns, rows){
  const t = h(`<div class="tablewrap"><table><thead><tr>${columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody></tbody></table></div>`);
  const tb = $("tbody", t);
  tb.innerHTML = rows.map(r => `<tr>${r.map(c => `<td title="${esc(c)}">${esc(c)}</td>`).join("")}</tr>`).join("");
  return t;
}

/* ---------------- Tool 1: Target Price -> Control File ---------------- */
function pageTP(t){
  const b1 = box(1, "Choose the files", "Same two questions the program used to ask: the Template_CF, then the Target Price file.");
  const ctrl = pickField({label: "Template_CF Excel (Control File)", kind: "file", key: "tp_ctrl", types: [["Excel files", ".xlsx,.xlsm"], ["All files", ""]],
                          onChange: v => { if (v) outDir.set(dirName(v)); }});
  const tp = pickField({label: "Target Price Excel (.xlsm)", kind: "file", key: "tp_tp", types: [["Excel Macro-Enabled Workbook", ".xlsm"], ["All files", ""]]});
  b1.append(h(`<div class="row"></div>`)); $(".row", b1).append(ctrl, tp);

  const b2 = box(2, "Review similar line names", "Lines ≥ 90% alike in 'Pole Materials' are listed so you can keep line 1, line 2, or both (was the “Choose Line” pop-up).");
  const pairsBox = h(`<div></div>`);
  const check = runArea("Check for similar lines", "search");
  b2.append(check, pairsBox);
  let pairs = null;
  check.button.onclick = async () => {
    if (!tp.get()) { check.fail("Select the Target Price file first."); return; }
    pairsBox.innerHTML = ""; pairs = null;
    const s = await check.run(() => api("/api/tp/analyze", {tp: tp.get()}), "Reading the Target Price…");
    if (!s) return;
    const r = s.result; pairs = r.pairs;
    pairsBox.append(h(`<div class="row" style="margin:12px 0"><span class="chip">PM: <b>${esc(r.pm)}</b></span><span class="chip">Scheme: <b>${esc(r.scheme_title)}</b></span><span class="chip">PID: <b>${esc(r.pid||"—")}</b></span></div>`));
    if (!pairs.length){ pairsBox.append(h(`<p class="status ok">✅ No similar lines detected – nothing to decide.</p>`)); return; }
    pairs.forEach((p, i) => {
      const card = h(`<div class="pair"><div class="meta">Sheet: ${esc(p.sheet)} · Similarity: ${p.similarity}%</div>
        <div class="ln"><b>1:</b> ${esc(p.s1)}</div><div class="ln"><b>2:</b> ${esc(p.s2)}</div><div class="diff">${esc(p.diff)}</div>
        <div class="seg"><label><input type="radio" name="pc${i}" value="1" checked><span>Use line 1</span></label><label><input type="radio" name="pc${i}" value="2"><span>Use line 2</span></label><label><input type="radio" name="pc${i}" value="keep_both"><span>Keep both</span></label></div></div>`);
      pairsBox.append(card);
    });
  };

  const b3 = box(3, "Write into the Control File", "A copy named “&lt;Control File&gt;_&lt;Scheme Title&gt;” is created (formulas and macros kept). By default it goes next to the Template_CF.");
  const outDir = pickField({label: "Save the copy into folder", kind: "folder", key: "out"});
  b3.append(outDir);
  const go = runArea("Write to Control File");
  b3.append(h(`<div style="height:12px"></div>`), go);
  go.button.onclick = () => {
    if (!ctrl.get() || !tp.get()) { go.fail("Select both files in step 1."); return; }
    if (pairs === null && !confirm("You haven't run “Check for similar lines”. Any similar lines will default to line 1. Continue?")) return;
    const choices = (pairs || []).map((_, i) => (b2.querySelector(`input[name=pc${i}]:checked`) || {}).value || "1");
    go.run(() => api("/api/tp/run", {control: ctrl.get(), tp: tp.get(), choices, output_dir: outDir.get()}), "Writing…");
  };
  app.append(b1, b2, b3);
}

  b3.append(run);
  run.button.onclick = () => {
    try { if (!agg.get() || !trk.get() || !misc.get()) throw new Error("Select all three input files."); save.validate(); } catch(e){ run.fail(e.message); return; }
    run.run(() => api("/api/master/run", {aggregated: agg.get(), tracker: trk.get(), misc: misc.get(), include_man_day: $("input", md).checked, ...save.get()}), "Building master…");
  };
  app.append(b1, b2, b3);
}

/* ---------------- Tool 4: Materials / CV report ---------------- */
function pageMaterials(t){
  let path = "";
  const b1 = box(1, "Load CSV / Parquet");
  const src = pickField({label: "Master file", kind: "file", key: "mat_in", types: [["Parquet", ".parquet"], ["CSV", ".csv"], ["All files", ""]],
                         onChange: v => { path = v; if (v) { load(); save.setDir(dirName(v)); } }});
  const loadStat = h(`<p class="status" style="margin:10px 0 0"></p>`);
  b1.append(src, loadStat);

  const b2 = box(2, "Filters", "Leave a box on “All” for no restriction. Each box also lets you type in your own value.");
  const cols = ["shire", "project", "circuit", "project_name", "cat"];
  const labels = {cat: "Category"};
  const boxes = {};
  const fr = h(`<div class="mfilters"></div>`);
  cols.forEach(c => { boxes[c] = comboFilter(labels[c] || c); fr.append(boxes[c]); });
  b2.append(fr);
  const dateRow = h(`<div class="row" style="margin-top:14px"></div>`);
  const dateBox = comboFilter("Date Filter", 230);
  const start = h(`<div class="field"><label>Start</label><input type="date"></div>`);
  const end = h(`<div class="field"><label>End</label><input type="date"></div>`);
  dateRow.append(dateBox, start, end);
  b2.append(dateRow);
  const cvRow = h(`<div class="row" style="margin-top:14px"></div>`);
  const cvBox = comboFilter("CV Groups (All = every group)", 230);
  cvRow.append(cvBox); b2.append(cvRow);
  const applyRow = h(`<div class="runbar" style="margin-top:16px"><button class="btn">${I.filter} Apply Filters</button><span class="status"></span></div>`);
  b2.append(applyRow);
  const applyStat = $(".status", applyRow);

  const payload = () => ({path, filters: Object.fromEntries(cols.map(c => [c, boxes[c].get()])), dates: dateBox.get(),
                          start: $("input", start).value, end: $("input", end).value});
  async function load(){
    loadStat.className = "status"; loadStat.textContent = "Loading the file… (large files on the share can take a moment)";
    try {
      const o = await api("/api/materials/options", {path});
      cols.forEach(c => { boxes[c].setValues(o.options[c] || []); boxes[c].clear(); });
      dateBox.setValues(o.date_options); dateBox.setSelection(o.date_default);
      cvBox.setValues(o.cv_groups); cvBox.clear();
      loadStat.className = "status ok"; loadStat.textContent = `Loaded ${o.rows} rows`;
      applyStat.textContent = "";
    } catch(e){ loadStat.className = "status err"; loadStat.textContent = e.message; }
  }
  $(".btn", applyRow).onclick = async () => {
    if (!path) { applyStat.className = "status err"; applyStat.textContent = "Load a file first."; return; }
    applyStat.className = "status"; applyStat.textContent = "Filtering…";
    try { const r = await api("/api/materials/apply", payload()); applyStat.className = "status ok"; applyStat.textContent = `Filtered rows: ${r.rows}`; }
    catch(e){ applyStat.className = "status err"; applyStat.textContent = e.message; }
  };

  const b3 = box(3, "Export Excel", "The workbook has Summary, Combined, one sheet per category and the CV8 / CV31 resumes.");
  const save = saveField({defName: "Materials_Report.xlsx"});
  const run = runArea("Export Excel", "save");
  b3.append(save, h(`<div style="height:12px"></div>`), run);
  run.button.onclick = () => {
    try { if (!path) throw new Error("Load a file first (step 1)."); save.validate(); } catch(e){ run.fail(e.message); return; }
    run.run(() => api("/api/materials/export", {...payload(), cv_groups: cvBox.get(), ...save.get()}), "Generating the Excel file…");
  };
  app.append(b1, b2, b3);
}

/* ---------------- Tool 5: Work Instructions & Map check ---------------- */
function pageWI(t){
  let path = "", defaults = {network_root: "", similarity_threshold: 85};
  let pdfEntries = [];
  const tabs = h(`<div class="tabs"><button class="tab on"><span class="num">1</span>Load &amp; Filter</button><button class="tab"><span class="num">2</span>Generate Work Instructions</button><button class="tab"><span class="num">3</span>Check WorkPacks vs Control Files</button></div>`);
  const panes = [h(`<div></div>`), h(`<div class="hidden"></div>`), h(`<div class="hidden"></div>`)];
  [...tabs.children].forEach((b, i) => b.onclick = () => { [...tabs.children].forEach((x, j) => x.classList.toggle("on", i === j)); panes.forEach((p, j) => p.classList.toggle("hidden", i !== j)); });
  app.append(tabs, ...panes);

  /* --- Tab 1 --- */
  const a1 = box(null, `${I.db.replace("<svg","<svg width=18 height=18")} Master parquet file`);
  const src = pickField({label: "Select master parquet file", kind: "file", key: "wi_in", types: [["Parquet files", ".parquet"], ["All files", ""]],
                         onChange: v => { path = v; if (v) { load(); saveW.setDir(dirName(v)); saveR.setDir(dirName(v)); } }});
  const loadStat = h(`<p class="status" style="margin:10px 0 0">No file loaded</p>`);
  a1.append(src, loadStat);
  const a2 = box(null, `${I.filter.replace("<svg","<svg width=18 height=18")} Filters`, "Search to narrow a list, click items to toggle, leave a filter empty = no restriction on that field.");
  const dr = h(`<div class="row" style="margin-bottom:12px"></div>`);
  const dFrom = h(`<div class="field"><label>Date from</label><input type="date"></div>`);
  const dTo = h(`<div class="field"><label>Date to</label><input type="date"></div>`);
  dr.append(dFrom, dTo, h(`<span class="status">(this range also drives the network scan on tab 3)</span>`));
  a2.append(dr);
  const fdefs = [["shires","District"],["projects","Project"],["circuits","Circuit"],["sourcefiles","Sourcefile"],["poles","Pole"]];
  const lf = {}; const grid = h(`<div class="lfilters"></div>`);
  fdefs.forEach(([k, l]) => { lf[k] = listFilter(l); grid.append(lf[k]); });
  a2.append(grid);
  const ar = h(`<div class="runbar" style="margin-top:14px"><button class="btn primary">${I.filter} Apply filters</button><button class="btn">Clear all filters</button><span class="status"></span></div>`);
  a2.append(ar);
  const fStat = $(".status", ar);
  const a3 = box(null, "Preview (filtered rows, first 500)");
  const prevWrap = h(`<div><p class="status">Load a file to see a preview.</p></div>`);
  a3.append(prevWrap);
  panes[0].append(a1, a2, a3);

  const filters = () => ({...Object.fromEntries(fdefs.map(([k]) => [k, lf[k].get()])), date_from: $("input", dFrom).value, date_to: $("input", dTo).value});
  async function preview(){
    fStat.className = "status"; fStat.textContent = "Filtering…";
    try {
      const r = await api("/api/wi/preview", {path, filters: filters()});
      fStat.className = "status ok"; fStat.textContent = `${r.count} rows match the filters`;
      prevWrap.innerHTML = ""; prevWrap.append(tableEl(r.columns, r.rows));
    } catch(e){ fStat.className = "status err"; fStat.textContent = e.message; }
  }
  async function load(){
    loadStat.className = "status"; loadStat.textContent = "Loading… (large files on the share can take a moment)";
    try {
      const o = await api("/api/wi/options", {path});
      o.fields.forEach(f => lf[f.key].setValues(f.values));
      loadStat.className = "status ok"; loadStat.textContent = `${baseName(path)}  (${o.rows} rows)`;
      preview();
    } catch(e){ loadStat.className = "status err"; loadStat.textContent = e.message; }
  }
  const [bApply, bClear] = ar.querySelectorAll(".btn");
  bApply.onclick = () => { if (!path) { fStat.className = "status err"; fStat.textContent = "Please load a parquet file first."; return; } preview(); };
  bClear.onclick = () => { fdefs.forEach(([k]) => lf[k].clear()); $("input", dFrom).value = ""; $("input", dTo).value = ""; if (path) preview(); };

  /* shared "maps selected" label (used by tabs 2 and 3) */
  const mapLabels = [];
  const mapLabel = () => { const el = h(`<span class="chip"></span>`); mapLabels.push(el); refreshMaps(); return el; };
  function refreshMaps(){
    const n = pdfEntries.length, nf = new Set(pdfEntries.map(e => e.folder).filter(Boolean)).size;
    const txt = !n ? "No PDFs selected" : nf ? `${n} PDF(s) selected (${nf} folder(s))` : `${n} PDF(s) selected`;
    mapLabels.forEach(l => l.textContent = "🗺 " + txt);
  }
  function addEntries(list){
    const have = new Set(pdfEntries.map(e => e.path));
    list.forEach(e => { if (!have.has(e.path)) { pdfEntries.push(e); have.add(e.path); } });
    refreshMaps();
  }

  /* --- Tab 2 --- */
  const w1 = box(1, `Work Instructions document`, "Built from the CURRENTLY FILTERED rows (tab 1): one header block per date + sourcefile, poles bulleted with their MD Poling instructions in workflow order, Times New Roman 12pt double-spaced. Joint items show red/underlined; a quantity of 1 is never shown.");
  const useMap = h(`<label style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><input type="checkbox" checked> Order poles per the map sequence (uses the PDFs added on tab 3, if any)</label>`);
  const mapRow = h(`<div class="row" style="margin-bottom:12px"></div>`); mapRow.append(mapLabel());
  const saveW = saveField({defName: "Work_Instructions.docx"});
  const runW = runArea("Generate Work Instructions", "word");
  w1.append(useMap, mapRow, saveW, h(`<div style="height:12px"></div>`), runW);
  panes[1].append(w1);
  runW.button.onclick = () => {
    try { if (!path) throw new Error("Load a parquet file and apply filters first (tab 1)."); saveW.validate(); } catch(e){ runW.fail(e.message); return; }
    runW.run(() => api("/api/wi/word", {path, filters: filters(), pdf_entries: pdfEntries, use_map_order: $("input", useMap).checked, ...saveW.get()}), "Generating document…");
  };

  /* --- Tab 3 --- */
  const p1 = box(1, "Scan the network for Workpack zones", "Uses the date range set on tab 1. Every outage folder in range is searched for “Workpack zones” folders (or its deepest folders with PDFs).");
  const rootF = pickField({label: "Network root (Outages Programme)", kind: "folder", key: "wi_root"});
  const drive = h(`<div class="field"><label>Mapped drive (optional, e.g. Z:)</label><input type="text" style="width:110px"></div>`);
  const r1 = h(`<div class="row"></div>`); r1.append(rootF, drive); p1.append(r1);
  const scan = runArea("Scan for maps in date range", "search");
  p1.append(h(`<div style="height:12px"></div>`), scan);
  scan.button.onclick = async () => {
    if (!path) { scan.fail("Please load a parquet file first (tab 1)."); return; }
    if (!rootF.get()) { scan.fail("Choose the Outages Programme root folder first."); return; }
    const df = $("input", dFrom).value, dt = $("input", dTo).value;
    if (!df && !dt && !confirm("No date range is set on tab 1. This will scan EVERY outage folder under the network path, which may take a long time and find a very large number of maps.\n\nContinue anyway?")) return;
    const s = await scan.run(() => api("/api/wi/scan", {root: rootF.get(), date_from: df, date_to: dt}), "Scanning…");
    if (!s) return;
    const r = s.result;
    if (!r.entries.length) {
      let msg = "No PDF maps were found inside 'Workpack zones' folders for the selected date range.";
      if (r.no_zone_outages.length) msg += `\n\n${r.no_zone_outages.length} outage folder(s) in this date range had no 'Workpack zones' folder at all:\n` + r.no_zone_outages.slice(0,25).map(o => "  • " + o).join("\n") + (r.no_zone_outages.length > 25 ? `\n  (+${r.no_zone_outages.length-25} more)` : "");
      alert(msg); return;
    }
    addEntries(r.entries);
    if (r.no_zone_outages.length) alert(`These ${r.no_zone_outages.length} outage folder(s) were in range and scanned, but had no 'Workpack zones' folder inside them - they legitimately contribute no maps:\n` + r.no_zone_outages.slice(0,25).map(o => "  • " + o).join("\n") + (r.no_zone_outages.length > 25 ? `\n  (+${r.no_zone_outages.length-25} more)` : ""));
  };

  const p2 = box(2, "Or add maps manually");
  const r2 = h(`<div class="row"><button class="btn">${I.folder} Add folder manually…</button><button class="btn">${I.file} Add individual PDF files…</button><button class="btn">Clear selection</button></div>`);
  r2.append(mapLabel());
  const manStat = h(`<p class="status" style="margin:8px 0 0"></p>`);
  p2.append(r2, manStat);
  const [bFolder, bFiles, bClearM] = r2.querySelectorAll(".btn");
  bFolder.onclick = async () => {
    const f = await FB.open({title: "Select a folder containing PDF drawings", mode: "folder", key: "wi_pdf"}); if (!f) return;
    manStat.className = "status"; manStat.textContent = "Looking for PDFs…";
    try { const r = await api("/api/wi/add_folder", {folder: f}); addEntries(r.entries); manStat.className = "status ok"; manStat.textContent = `Added ${r.entries.length} PDF(s) from ${baseName(f)}`; }
    catch(e){ manStat.className = "status err"; manStat.textContent = e.message; }
  };
  bFiles.onclick = async () => {
    const fs = await FB.open({title: "Select PDF files", mode: "files", key: "wi_pdf", types: [["PDF files", ".pdf"]]}); if (!fs || !fs.length) return;
    try { const r = await api("/api/wi/add_files", {files: fs}); addEntries(r.entries); manStat.className = "status ok"; manStat.textContent = `Added ${r.entries.length} PDF(s)`; }
    catch(e){ manStat.className = "status err"; manStat.textContent = e.message; }
  };
  bClearM.onclick = () => { pdfEntries = []; refreshMaps(); manStat.textContent = ""; };

  const p3 = box(3, "Cross-reference report", "Excel workbook with 4 sheets: Control File Vs maps · Pole Summary · Poles not found in maps · Poles without dates on CF. Map names are hyperlinked to the PDFs.");
  const thr = h(`<div class="field"><label>Similarity threshold (%)</label><input type="number" min="0" max="100" style="width:110px"></div>`);
  const r3 = h(`<div class="row" style="margin-bottom:12px"></div>`); r3.append(thr);
  const saveR = saveField({defName: "Pole_PDF_CrossReference_Report.xlsx"});
  const runR = runArea("Generate cross-reference report", "chart");
  p3.append(r3, saveR, h(`<div style="height:12px"></div>`), runR);
  runR.button.onclick = () => {
    try {
      if (!path) throw new Error("Load a parquet file and apply filters first.");
      if (!pdfEntries.length) throw new Error("Add at least one folder or PDF file first, or use the network scan above.");
      if (isNaN(parseFloat($("input", thr).value))) throw new Error("Threshold must be a number, e.g. 85");
      saveR.validate();
    } catch(e){ runR.fail(e.message); return; }
    runR.run(() => api("/api/wi/report", {path, filters: filters(), pdf_entries: pdfEntries, threshold: parseFloat($("input", thr).value),
      network_root: rootF.get(), drive_letter: $("input", drive).value, ...saveR.get()}), "Reading PDFs…");
  };
  panes[2].append(p1, p2, p3);

  api("/api/defaults").then(d => { defaults = d; if (!rootF.get()) rootF.set(d.network_root); $("input", thr).value = d.similarity_threshold; }).catch(() => { $("input", thr).value = 85; });
}

/* ---------------- router ---------------- */
const PAGES = {tp: pageTP, aggregate: pageAggregate, master: pageMaster, materials: pageMaterials, wi: pageWI};
function route(){
  const id = location.hash.replace("#", "");
  const t = TOOLS.find(x => x.id === id);
  window.scrollTo(0, 0);
  if (!t) return home();
  app.innerHTML = ""; app.append(toolHead(t)); PAGES[id](t);
}
window.addEventListener("hashchange", route);

/* ---------------- start ---------------- */
(async function(){
  $("#logo").src = API + "/api/logo";
  const pill = $("#srv");
  try {
    await api("/api/ping");
    const roots = await FB.loadRoots();
    const ok = roots.filter(r => r.reachable).length;
    pill.innerHTML = `<span class="dot ${ok ? "on" : "off"}"></span><span>${ok ? "Server connected · " + ok + "/" + roots.length + " folders reachable" : "Server up · network share not reachable"}</span>`;
  } catch(e){
    pill.innerHTML = `<span class="dot off"></span><span>${esc(e.message.includes("allowed") ? "This computer is not allowed" : "Server not reachable")}</span>`;
    pill.title = e.message;
  }
  route();
})();
</script>
